<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NIFTY Straddle Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h1 class="text-3xl font-bold text-center mb-2 text-cyan-400">NIFTY Straddle Bot</h1>
        <p class="text-center text-gray-400 mb-8">Login with your Kite Connect credentials</p>

        <form method="post" action="/login" class="space-y-6">
            <div>
                <label class="block text-sm mb-2">API Key</label>
                <input type="text" name="api_key" required
                       class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-cyan-400"
                       placeholder="Enter your API Key">
            </div>

            <div>
                <label class="block text-sm mb-2">API Secret</label>
                <input type="password" name="api_secret" required
                       class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-cyan-400"
                       placeholder="Enter your API Secret">
            </div>

            <button type="submit"
                    class="w-full bg-cyan-500 hover:bg-cyan-600 text-black font-bold py-3 rounded-lg transition">
                Login with Zerodha
            </button>
        </form>

        <p class="text-xs text-gray-500 mt-6 text-center">
            You will be redirected to Zerodha for authentication
        </p>
    </div>
</body>
</html>
